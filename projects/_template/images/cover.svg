<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Project cover placeholder</title>
  <desc id="desc">A light grid with a centered project cover label.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#dce3ea" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7ed"/>
      <stop offset="1" stop-color="#e8efff"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="810" fill="#f7f9fb"/>
  <rect width="1440" height="810" fill="url(#grid)"/>
  <circle cx="720" cy="405" r="260" fill="url(#glow)" opacity=".9"/>
  <rect x="438" y="313" width="564" height="184" rx="30" fill="#111a2b"/>
  <text x="720" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" letter-spacing="7" fill="#8aa1c0">RESEARCH</text>
  <text x="720" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">PROJECT COVER</text>
</svg>
