      <stop offset="0.55" stop-color="#123744"/>
      <stop offset="1" stop-color="#071117"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f4a261" stop-opacity=".58"/>
      <stop offset="1" stop-color="#f4a261" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f0e1"/>
      <stop offset="1" stop-color="#c7b991"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>

