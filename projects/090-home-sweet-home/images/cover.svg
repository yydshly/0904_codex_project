<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Home Sweet Home 四态空间 Morph 能力图</title>
  <desc id="desc">花园、客厅、餐厅和卧室四个空间围绕中央 Morph 控制核，通过程序化几何、Shader、动态光照和交互完成连续换景。</desc>
  <defs>
