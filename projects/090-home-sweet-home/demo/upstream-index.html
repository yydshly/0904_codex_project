<!DOCTYPE html>
<html lang="en">
<head>

<title>Maison Miniature — The Morphing Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f5f0e1; --beige:#e8dcc4; --coral:#f4a261; --gold:#e9c46a;
    --mint:#a8dadc; --teal:#264653; --ink:#161616;
    --glass-bg:rgba(245,240,225,.58); --glass-line:rgba(38,70,83,.14);
    --label:rgba(38,70,83,.62); --title:#22343e;
  }
  body.dark{
    --glass-bg:rgba(16,24,34,.52); --glass-line:rgba(245,240,225,.14);
    --label:rgba(245,240,225,.55); --title:#f2ead6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--cream);transition:background 1.2s ease}
  body.dark{background:#0d1620}
  #scene{position:fixed;inset:0;display:block;cursor:grab}
  #scene:active{cursor:grabbing}

  
  #placard{position:fixed;top:34px;left:38px;z-index:10;pointer-events:none;user-select:none}
  #placard .over{font-size:10px;letter-spacing:.32em;color:var(--label);font-weight:600;text-transform:uppercase;margin-bottom:10px;transition:color 1.2s ease}
  #stage{position:relative;height:46px;overflow:visible}
  #stage h1{font-family:'Fraunces',serif;font-weight:500;font-size:42px;line-height:1.05;color:var(--title);
    position:absolute;white-space:nowrap;transition:opacity .55s ease,transform .55s ease,color 1.2s ease}
  #stage h1.out{opacity:0;transform:translateY(-14px)}
  #stage h1.pre{opacity:0;transform:translateY(16px);transition:none}
  #placard .idx{margin-top:10px;font-size:11px;letter-spacing:.24em;color:var(--label);font-weight:500;transition:color 1.2s ease}
  #placard .idx em{font-style:normal;color:var(--coral)}

  
  #bar{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:14px;
    padding:10px 12px;border-radius:999px;background:var(--glass-bg);border:1px solid var(--glass-line);
    backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:0 12px 40px rgba(22,22,22,.10);transition:background 1.2s ease,border-color 1.2s ease}
  #dots{display:flex;gap:6px;padding:0 4px}
  .dot{width:26px;height:26px;border-radius:999px;border:none;background:transparent;cursor:pointer;position:relative;display:grid;place-items:center}
  .dot::after{content:"";width:7px;height:7px;border-radius:99px;background:var(--label);opacity:.5;transition:all .35s cubic-bezier(.2,.8,.2,1)}
  .dot:hover::after{opacity:.9;transform:scale(1.25)}
  .dot.on::after{width:18px;background:var(--coral);opacity:1}
  #morph{border:none;cursor:pointer;background:var(--ink);color:#fff;font-family:'Instrument Sans';font-weight:600;font-size:13px;
    letter-spacing:.04em;padding:11px 20px;border-radius:999px;display:flex;align-items:center;gap:9px;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,background .4s ease;box-shadow:0 6px 18px rgba(22,22,22,.22)}
  #morph:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 24px rgba(22,22,22,.28)}
  #morph:active{transform:translateY(0) scale(.97)}
  #morph.busy{pointer-events:none;opacity:.65}
  #morph svg{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
  #morph:hover svg{transform:translateX(3px)}
  .sep{width:1px;height:22px;background:var(--glass-line)}
  #mode{border:1px solid var(--glass-line);cursor:pointer;background:transparent;width:56px;height:30px;border-radius:999px;position:relative;transition:background .6s ease}
  #mode .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--gold);
    display:grid;place-items:center;transition:transform .5s cubic-bezier(.34,1.56,.64,1),background .6s ease}
  body.dark #mode .knob{transform:translateX(26px);background:var(--mint)}
  #mode svg{width:14px;height:14px;display:block}
  #hint{position:fixed;right:34px;bottom:38px;z-index:9;font-size:10px;letter-spacing:.22em;color:var(--label);
    text-transform:uppercase;pointer-events:none;transition:opacity 1.4s ease,color 1.2s ease}

  
  #loader{position:fixed;inset:0;z-index:50;overflow:hidden;background:
    radial-gradient(circle at 50% 45%,rgba(168,218,220,.23),transparent 30%),
    linear-gradient(135deg,#f8f4e8 0%,var(--cream) 52%,#ece2cf 100%);
    display:grid;place-items:center;transition:opacity .9s ease,filter .9s ease}
  #loader::before{content:"";position:absolute;inset:-18%;opacity:.28;pointer-events:none;
    background-image:linear-gradient(rgba(38,70,83,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(38,70,83,.11) 1px,transparent 1px);
    background-size:44px 44px;transform:perspective(720px) rotateX(66deg) translateY(20%);transform-origin:center 60%;
    animation:loaderGrid 8s linear infinite}
  #loader::after{content:"";position:absolute;left:-20%;right:-20%;top:50%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(244,162,97,.15),rgba(244,162,97,.95),rgba(244,162,97,.15),transparent);
    box-shadow:0 0 18px rgba(244,162,97,.45);animation:loaderScan 2.8s cubic-bezier(.4,0,.2,1) infinite}
  #loader.done{opacity:0;filter:blur(8px);pointer-events:none}
  .ta-loader{position:relative;z-index:2;width:min(460px,86vw);display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .ta-mark{position:relative;width:148px;height:148px;display:grid;place-items:center;filter:drop-shadow(0 12px 28px rgba(38,70,83,.12))}
  .ta-ring{position:absolute;inset:0;border:1px solid rgba(38,70,83,.18);border-radius:50%;animation:taRing 3.8s linear infinite}
  .ta-ring::before,.ta-ring::after{content:"";position:absolute;border-radius:50%;background:var(--coral);box-shadow:0 0 18px rgba(244,162,97,.7)}
  .ta-ring::before{width:7px;height:7px;left:50%;top:-4px;transform:translateX(-50%)}
  .ta-ring::after{width:5px;height:5px;right:15px;bottom:22px;background:var(--gold)}
  .ta-brackets{position:absolute;inset:18px;border:1px solid rgba(38,70,83,.09);transform:rotate(45deg);animation:taBracket 2.6s ease-in-out infinite}
  .ta-brackets::before,.ta-brackets::after{content:"";position:absolute;inset:14px;border:1px dashed rgba(38,70,83,.16)}
  .ta-brackets::after{inset:28px;border-style:solid;border-color:rgba(244,162,97,.24)}
  .ta-core{position:relative;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(232,220,196,.72));border:1px solid rgba(38,70,83,.15);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 18px 45px rgba(38,70,83,.12);animation:taCore 2.7s ease-in-out infinite}
  .ta-core::before{content:"";position:absolute;width:150%;height:34%;left:-25%;top:-45%;transform:rotate(-18deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.92),transparent);animation:taSweep 2.5s ease-in-out infinite}
  .ta-monogram{font-family:'Instrument Sans',system-ui,sans-serif;font-size:31px;font-weight:600;letter-spacing:-.07em;color:var(--teal);transform:translateX(-1px)}
  .ta-monogram b{font-weight:600;color:var(--coral)}
  .ta-word{font-family:'Instrument Sans',system-ui,sans-serif;font-size:22px;font-weight:600;letter-spacing:.22em;color:var(--teal);text-transform:uppercase;
    opacity:0;transform:translateY(8px);animation:taReveal .8s .2s cubic-bezier(.2,.8,.2,1) forwards}
  .ta-sub{margin-top:-10px;font-size:9px;font-weight:600;letter-spacing:.4em;color:var(--label);text-transform:uppercase;
    opacity:0;animation:taReveal .8s .42s ease forwards}
  .ta-progress{width:min(300px,68vw);height:2px;border-radius:4px;overflow:hidden;background:rgba(38,70,83,.11);position:relative}
  .ta-progress span{position:absolute;inset:0 auto 0 0;width:38%;background:linear-gradient(90deg,var(--teal),var(--coral),var(--gold));
    border-radius:inherit;box-shadow:0 0 12px rgba(244,162,97,.35);animation:taProgress 1.4s cubic-bezier(.65,0,.35,1) infinite}
  @keyframes taRing{to{transform:rotate(360deg)}}
  @keyframes taBracket{0%,100%{transform:rotate(45deg) scale(.96);opacity:.75}50%{transform:rotate(90deg) scale(1.03);opacity:1}}
  @keyframes taCore{0%,100%{transform:scale(.98)}50%{transform:scale(1.025)}}
  @keyframes taSweep{0%{top:-55%}58%,100%{top:135%}}
  @keyframes taReveal{to{opacity:1;transform:translateY(0)}}
  @keyframes taProgress{0%{left:-42%;width:36%}55%{width:58%}100%{left:106%;width:24%}}
  @keyframes loaderGrid{to{background-position:0 44px,44px 0}}
  @keyframes loaderScan{0%,100%{transform:translateY(-180px);opacity:0}18%{opacity:.7}62%{opacity:.35}80%{transform:translateY(180px);opacity:0}}
  @media (max-width:640px){
    #placard{top:20px;left:20px} #stage h1{font-size:30px} #hint{display:none}
    #bar{bottom:18px;gap:10px;padding:8px 10px}
  }
</style>

<script type="importmap">

  "three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';






const PAL = {
  cream:0xf5f0e1, beige:0xe8dcc4, coral:0xf4a261, gold:0xe9c46a,
  mint:0xa8dadc, teal:0x264653, ink:0x161616,
  oak:0xd9b88f, walnut:0x8a6748, walnutD:0x6f5238,
  sage:0x6a994e, grass:0x7fb069, grassD:0x5c8a4a,
  fabric:0xece0c8, blush:0xe9b8a0, stone:0xe3d9c2, night:0x0d1620
};
const C = h => new THREE.Color(h);


const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 220);
camera.position.set(11.2, 4.4, 11.4);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = false;
controls.minDistance = 7; controls.maxDistance = 26;
controls.minPolarAngle = 1.12; controls.maxPolarAngle = 1.46;   
controls.minAzimuthAngle = -0.08; controls.maxAzimuthAngle = 1.63; 
controls.enablePan = false;
const UP_AXIS = new THREE.Vector3(0,1,0);






const FIT_BOX = { min:new THREE.Vector3(-6.18,-1.24,-6.18), max:new THREE.Vector3(6.18,3.82,6.18) };
const FIT_CORNERS = [];
for (const x of [FIT_BOX.min.x, FIT_BOX.max.x])
  for (const y of [FIT_BOX.min.y, FIT_BOX.max.y])
    for (const z of [FIT_BOX.min.z, FIT_BOX.max.z]) FIT_CORNERS.push(new THREE.Vector3(x,y,z));
function fitDistance(){
  const t = controls.target;
  const dir = camera.position.clone().sub(t).normalize();
  const right = new THREE.Vector3().crossVectors(dir, UP_AXIS).normalize();
  const camUp = new THREE.Vector3().crossVectors(right, dir).normalize();
  const vT = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const hT = vT * camera.aspect;
  let need = 8;
  FIT_CORNERS.forEach(c=>{
    const v = c.clone().sub(t);
    const z = v.dot(dir);
    need = Math.max(need, z + Math.abs(v.dot(right))/hT, z + Math.abs(v.dot(camUp))/vT);
  });
  return need * 0.985;
}
let fitDist = 18;
function refit(){
  fitDist = fitDistance();
  controls.maxDistance = fitDist * 1.24;
  controls.minDistance = Math.max(6, fitDist * 0.42);
}

const diorama = new THREE.Group();
scene.add(diorama);


const U = {
  time:   { value: 0 },
  mode:   { value: 0 },   
};
const shaderMats = [];     


{
  const geo = new THREE.SphereGeometry(90, 48, 32);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ uTime:U.time, uMode:U.mode },
    vertexShader:`
      varying vec3 vDir;
      void main(){ vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vDir; uniform float uTime, uMode;
      float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
      float noise(vec2 p){
        vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
        float a=hash(vec3(i,1.)), b=hash(vec3(i+vec2(1,0),1.));
        float c=hash(vec3(i+vec2(0,1),1.)), d=hash(vec3(i+vec2(1,1),1.));
        return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
      void main(){
        float h = clamp(vDir.y, -1.0, 1.0);
        
        vec3 lTop = vec3(0.808,0.882,0.925), lHor = vec3(0.976,0.949,0.882), lBot = vec3(0.902,0.855,0.757);
        
        vec3 dTop = vec3(0.031,0.075,0.133), dHor = vec3(0.106,0.196,0.243), dBot = vec3(0.043,0.063,0.086);
        vec3 lc = h > 0.0 ? mix(lHor, lTop, pow(h,0.62)) : mix(lHor, lBot, pow(-h,0.7));
        vec3 dc = h > 0.0 ? mix(dHor, dTop, pow(h,0.55)) : mix(dHor, dBot, pow(-h,0.8));
        
        float band = noise(vec2(atan(vDir.x,vDir.z)*2.2 + uTime*0.03, h*3.0 - uTime*0.015));
        lc += (band-0.5)*0.045;
        dc += (band-0.5)*vec3(0.03,0.05,0.06);
        
        float star = 0.0;
        vec3 g = vDir*170.0; vec3 id = floor(g);
        float rn = hash(id);
        if(rn > 0.992 && h > 0.04){
          vec3 f = fract(g)-0.5;
          float d = length(f);
          float tw = 0.6 + 0.4*sin(uTime*2.2 + rn*60.0);
          star = smoothstep(0.28, 0.0, d) * tw;
        }
        vec3 col = mix(lc, dc, uMode) + star * uMode * vec3(0.9,0.95,1.0)*0.85;
        
        col *= 1.0 - 0.18*smoothstep(0.0,-0.6,h);
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  scene.add(new THREE.Mesh(geo, mat));
}


const hemi = new THREE.HemisphereLight(0xdfeaf2, 0xe8dcc4, 0.85);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xfff4e0, 0.22);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.7);
sun.position.set(7, 11, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-8; sun.shadow.camera.right=8;
sun.shadow.camera.top=8; sun.shadow.camera.bottom=-8;
sun.shadow.camera.near=2; sun.shadow.camera.far=30;
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
scene.add(sun);



const rimRegistry = [];
function rimify(mat, strength=0.09, color=0xfff3dd){
  mat.userData.rim = { s:strength, c:C(color) };
  mat.onBeforeCompile = sh => {
    sh.uniforms.uRimColor = { value: mat.userData.rim.c };
    sh.uniforms.uRimStrength = { value: strength };
    sh.uniforms.uModeRim = U.mode;
    mat.userData.shader = sh;
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform vec3 uRimColor; uniform float uRimStrength; uniform float uModeRim;')
      .replace('#include <opaque_fragment>', `
        float rimF = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), 3.0);
        totalEmissiveRadiance += uRimColor * rimF * uRimStrength * (1.0 + uModeRim*0.8);
        #include <opaque_fragment>`);
  };
  rimRegistry.push(mat);
  return mat;
}

function swayify(mat, amp=0.05, freq=1.0, heightRef=2.0){
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = sh => {
    if (prev) prev(sh);
    sh.uniforms.uTime = U.time;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float swayK = clamp(1.0 - (position.y/${heightRef.toFixed(2)} + 0.5), 0.0, 1.0);
        transformed.x += sin(position.y*${(3.0*freq).toFixed(2)} + uTime*${(1.1*freq).toFixed(2)} + position.z*2.0) * ${amp.toFixed(3)} * swayK;
        transformed.z += sin(position.y*${(4.0*freq).toFixed(2)} + uTime*${(1.4*freq).toFixed(2)} + position.x*2.0) * ${amp.toFixed(3)} * swayK;`);
  };
  mat.customProgramCacheKey = () => 'sway'+amp+freq+heightRef+(prev?'r':'');
  return mat;
}
function std(color, rough=0.85, metal=0.0, rim=0.08){
  const m = new THREE.MeshStandardMaterial({ color, roughness:rough, metalness:metal });
  return rim ? rimify(m, rim) : m;
}
const M = {
  cream:  std(PAL.cream, 0.92),
  creamS: std(0xefe7d2, 0.95),
  fabric: std(PAL.fabric, 0.96),
  coral:  std(PAL.coral, 0.82),
  coralD: std(0xe76f51, 0.85),
  gold:   std(PAL.gold, 0.55, 0.35, 0.05),
  mint:   std(PAL.mint, 0.85),
  teal:   std(PAL.teal, 0.8),
  tealM:  std(PAL.teal, 0.45, 0.55, 0.04),
  oak:    std(PAL.oak, 0.7),
  walnut: std(PAL.walnut, 0.62),
  walnutD:std(PAL.walnutD, 0.6),
  ink:    std(PAL.ink, 0.86, 0.0, 0.025),
  sage:   std(PAL.sage, 0.9),
  grass:  std(PAL.grass, 0.95),
  grassD: std(PAL.grassD, 0.95),
  soil:   std(0x5a4331, 0.98, 0.0, 0.025),
  stone:  std(PAL.stone, 0.9),
  white:  std(0xfdfbf4, 0.9),
  blush:  std(PAL.blush, 0.9),
};
M.sageSway = swayify(std(PAL.sage, 0.92), 0.02, 1.6, 2.0);
M.grassSway = swayify(std(PAL.grass, 0.95), 0.025, 1.8, 1.0);
M.leafLight = swayify(std(0x85ad63, 0.94), 0.018, 1.35, 1.7);
M.leafDeep  = swayify(std(0x426b3a, 0.94), 0.016, 1.55, 1.7);
M.leafOlive = swayify(std(0x718c4f, 0.95), 0.02, 1.75, 1.5);
M.curtain = swayify(std(0xf3e7cf, 0.97, 0, 0.1), 0.09, 1.35, 1.9);
M.curtain.side = THREE.DoubleSide;


function microTexture(kind='weave'){
  const c = document.createElement('canvas'); c.width=c.height=64;
  const x = c.getContext('2d'); x.fillStyle='#808080'; x.fillRect(0,0,64,64);
  if (kind==='weave'){
    x.globalAlpha=.16; x.strokeStyle='#b0b0b0'; x.lineWidth=1;
    for(let i=0;i<64;i+=4){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,64); x.stroke(); x.beginPath(); x.moveTo(0,i+2); x.lineTo(64,i+2); x.stroke(); }
  } else {
    x.globalAlpha=.18; x.strokeStyle='#b7b7b7';

  }

function beamBetween(a,b,r=0.025,mat=M.walnutD,segments=10){
  const av = new THREE.Vector3(...a), bv = new THREE.Vector3(...b);
  const v = bv.clone().sub(av), o = mesh(CYL(r,r,v.length(),segments),mat);

{

        float fhash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
        float fnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
          return mix(mix(fhash(i),fhash(i+vec2(1,0)),f.x),mix(fhash(i+vec2(0,1)),fhash(i+vec2(1,1)),f.x),f.y); }`)
      .replace('#include <map_fragment>',`#include <map_fragment>
        vec2 fp = vLp.xy;

const rugU = {
  uRound:{value:0}, uField:{value:C(0xe7d7bd)}, uBorder:{value:C(0xe0764a)},
  uMotif:{value:C(PAL.gold)}
};
function rugMesh(){
  const mat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.97 });
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, rugU);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec2 vRp;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvRp = position.xy;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>',`#include <common>
        varying vec2 vRp; uniform float uRound; uniform vec3 uField,uBorder,uMotif;
        float rh(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5); }`)
      .replace('#include <map_fragment>',`#include <map_fragment>
        vec2 rp = vRp;                                  
        float dRect = max(abs(rp.x), abs(rp.y));
        float dCirc = length(rp);
        float d = mix(dRect, dCirc, uRound);
        if (d > 0.495) discard;
        vec3 col = uField;
        float fiber = rh(floor(rp*220.0))*0.06;
        col *= 0.96 + fiber;
        if (d > 0.435) col = uBorder;
        else if (abs(d-0.30) < 0.012) col = uMotif;
        else if (abs(d-0.155) < 0.006) col = uBorder*1.02;
        diffuseColor.rgb = col;`);
  };
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1,1), mat);
  m.rotation.x = -Math.PI/2; m.receiveShadow = true;
  return m;
}

function fairyLightsForm(){
  const g = new THREE.Group();
  const runs = [
    { a:[-1.15,2.35,-0.95], b:[1.15,2.35,0.95], n:11, sag:0.34 },
    { a:[-1.15,2.35,0.95],  b:[1.15,2.35,-0.95], n:11, sag:0.30 },
  ];
  const pos = [], phase = [];
  runs.forEach(r=>{
    for (let i=0;i<r.n;i++){
      const t = i/(r.n-1);
      const x = r.a[0]+(r.b[0]-r.a[0])*t;
      const y = r.a[1]+(r.b[1]-r.a[1])*t - r.sag*4*t*(1-t);
      const z = r.a[2]+(r.b[2]-r.a[2])*t;
      pos.push(x,y,z); phase.push(t*17.0 + r.sag*40);
    }
  });
  
  const lineMat = new THREE.LineBasicMaterial({ color:0x4a3b2a, transparent:true, opacity:0.7 });
  runs.forEach(r=>{
    const pts = [];
    for (let i=0;i<r.n;i++){
      const t = i/(r.n-1);
      pts.push(new THREE.Vector3(r.a[0]+(r.b[0]-r.a[0])*t, r.a[1]+(r.b[1]-r.a[1])*t - r.sag*4*t*(1-t), r.a[2]+(r.b[2]-r.a[2])*t));
    }
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('aPhase', new THREE.Float32BufferAttribute(phase,1));
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:U.time, uMode:U.mode },
    vertexShader:`attribute float aPhase; uniform float uTime,uMode; varying float vA;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        float tw = 0.72 + 0.28*sin(uTime*2.4 + aPhase);
        vA = tw * (0.34 + 0.95*uMode);
        gl_PointSize = (64.0 * tw * (0.75+0.5*uMode)) / max(1.0,-mv.z);
        gl_Position = projectionMatrix * mv; }`,
    fragmentShader:`varying float vA;
      void main(){
        float d = length(gl_PointCoord-0.5);
        float a = smoothstep(0.5,0.05,d); a*=a;
        gl_FragColor = vec4(vec3(1.0,0.83,0.55)*1.6, a*vA); }`
  });
  const pts = new THREE.Points(geo, mat); pts.frustumCulled = false;
  g.add(pts);
  return g;
}


function fireflies(){
  const N = 42, pos = [], seed = [];
  for (let i=0;i<N;i++){
    pos.push((Math.random()-0.5)*6.4, 0.3+Math.random()*2.0, (Math.random()-0.5)*6.4);
    seed.push(Math.random()*100);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('aSeed', new THREE.Float32BufferAttribute(seed,1));
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:U.time, uOn:{value:0} },
    vertexShader:`attribute float aSeed; uniform float uTime; varying float vA;
      void main(){
        vec3 p = position;
        p.x += sin(uTime*0.4 + aSeed)*0.5;
        p.y += sin(uTime*0.6 + aSeed*1.7)*0.3;
        p.z += cos(uTime*0.5 + aSeed*0.9)*0.5;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        float blink = smoothstep(0.35,0.9, 0.5+0.5*sin(uTime*1.4+aSeed*3.0));
        vA = blink;
        gl_PointSize = (26.0*(0.6+0.4*blink)) / max(1.0,-mv.z);
        gl_Position = projectionMatrix * mv; }`,
    fragmentShader:`varying float vA; uniform float uOn;
      void main(){
        float d = length(gl_PointCoord-0.5);
        float a = smoothstep(0.5,0.0,d); a*=a;
        gl_FragColor = vec4(vec3(0.85,1.0,0.55)*1.4, a*vA*uOn); }`
  });
  const p = new THREE.Points(geo, mat); p.frustumCulled = false;
  p.userData.mat = mat;
  return p;
}

const flies = fireflies(); flies.position.y = FY; diorama.add(flies);



const SCENES = ['Garden','Living Room','Dining Room','Bedroom'];
const easeOutExpo = t => t>=1 ? 1 : 1 - Math.pow(2,-10*t);
const easeInQuad  = t => t*t;
const easeInOutCubic = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOutBack = t => { const c=1.70158,c3=c+1; return 1 + c3*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const clamp01 = t => Math.min(1, Math.max(0, t));
const V3 = s => Array.isArray(s) ? new THREE.Vector3(...s) : new THREE.Vector3(s,s,s);

let cur = 0, morph = null;
let modeTarget = 0, modeCur = 0;
const weights = [1,0,0,0];


const SP = {
  grassMix:[1,0,0,0],
  woodA:[0xdcbd93,0xdcbd93,0xc9a06f,0xe3cba6].map(C),
  woodB:[0xc8a374,0xc8a374,0xb08856,0xd4b98d].map(C),
  rugRound:[0,0,1,0.12],
  rugField:[0xe7d7bd,0xe7d7bd,0xe4d3b8,0xf0e9dc].map(C),
  rugBorder:[0xe0764a,0xe0764a,0x264653,0xe9b8a0].map(C),
  rugMotif:[0xe9c46a,0xe9c46a,0xe9c46a,0xa8dadc].map(C),
  wall:[0xa9bf8c,0xf5f0e1,0xefe0c6,0xf2ebe3].map(C),
  camDist:[1.0,0.98,0.96,0.98],   
};
const tmpC = new THREE.Color();
function blendCol(arr, w, out){ out.setRGB(0,0,0); arr.forEach((c,i)=>{ tmpC.copy(c).multiplyScalar(w[i]); out.add(tmpC); }); return out; }
function blendNum(arr, w){ return arr.reduce((s,v,i)=> s+v*w[i], 0); }

function applyScene(idx){
  ACTORS.forEach(a=>{
    const st = a.states[idx];
    if (st){
      a.group.position.set(st.p[0],st.p[1],st.p[2]);
      a.group.rotation.y = st.ry||0;
      a.group.scale.copy(V3(st.s??1));
      a.forms.forEach(f=>{ if (f) f.scale.setScalar(0); });
      const active = a.forms[idx];
      if (active) active.scale.setScalar(1);
      if (a.staggerChildren){ active && active.children.forEach(c=>c.scale.setScalar(1)); }
    } else {
      a.group.scale.setScalar(0);
      a.forms.forEach(f=> f && f.scale.setScalar(0));
    }
  });
}

function startMorph(to, intro=false){
  if (morph) return;
  if (!intro && to===cur) return;
  const from = intro ? -1 : cur;
  let total = 0;
  ACTORS.forEach(a=>{
    const fs = from>=0 ? a.states[from] : null;
    const ts = a.states[to];
    if (!fs && !ts){ a._tr = null; return; }
    const tr = {};
    tr.toForm = ts ? a.forms[to] : null;
    tr.fromForm = (fs && from>=0) ? a.forms[from] : null;
    if (ts){ tr.toP = new THREE.Vector3(ts.p[0],ts.p[1],ts.p[2]); tr.toRy = ts.ry||0; tr.toS = V3(ts.s??1); }
    else   { tr.toP = new THREE.Vector3(fs.p[0],fs.p[1],fs.p[2]); tr.toRy = fs.ry||0; tr.toS = new THREE.Vector3(0,0,0); }
    if (fs){ tr.fromP = new THREE.Vector3(fs.p[0],fs.p[1],fs.p[2]); tr.fromRy = fs.ry||0; tr.fromS = V3(fs.s??1); }
    else   { tr.fromP = tr.toP.clone(); tr.fromP.y -= a.rise||0; tr.fromRy = tr.toRy - 0.8; tr.fromS = new THREE.Vector3(0,0,0); }
    const travel=tr.fromP.distanceTo(tr.toP);
    tr.lift = a.key.startsWith('wall') || a.key==='windowDress' ? 0 : a.key==='rug' ? .045 : Math.min(.82,.14+travel*.11);
    tr.shrinkTravel = !!(tr.fromForm && tr.fromForm===tr.toForm && travel>.18);
    tr.switchAt = travel>.35 ? .52 : .35;
    tr.delay = a.stag * (intro?0.55:1.0) + (intro?0.15:0);
    tr.dur = 1.5;
    a._tr = tr;
    total = Math.max(total, tr.delay + tr.dur);
  });
  morph = { from, to, t:0, total, intro };
  setBusy(true);
  setTitle(SCENES[to], to);
}

function stepMorph(dt){
  morph.t += dt;
  const t = morph.t;
  let done = true;
  ACTORS.forEach(a=>{
    const tr = a._tr;
    if (!tr) return;
    const lt = clamp01((t - tr.delay)/tr.dur);
    if (lt < 1) done = false;
    const e = easeOutExpo(lt);
    const move=easeInOutCubic(lt);
    a.group.position.lerpVectors(tr.fromP, tr.toP, move);
    a.group.position.y += Math.sin(Math.PI*lt)*tr.lift;
    let d = tr.toRy - tr.fromRy; d = Math.atan2(Math.sin(d), Math.cos(d));
    a.group.rotation.y = tr.fromRy + d*move;
    a.group.scale.lerpVectors(tr.fromS, tr.toS, e);
    const { fromForm, toForm } = tr;
    if (fromForm && fromForm !== toForm){
      fromForm.scale.setScalar(Math.max(0.0001, 1 - easeInQuad(clamp01(lt/0.4))));
    }
    if (toForm && toForm !== fromForm){
      if (a.staggerChildren){
        toForm.scale.setScalar(1);
        toForm.children.forEach((c,i)=> c.scale.setScalar(Math.max(0.0001, easeOutBack(clamp01((lt-0.2-i*0.13)/0.55)))));
      } else {
        const g = fromForm ? clamp01((lt-tr.switchAt)/(1-tr.switchAt)) : lt;
        toForm.scale.setScalar(Math.max(0.0001, easeOutBack(g)));
      }
    }
    if(tr.shrinkTravel && fromForm){
      fromForm.scale.setScalar(Math.max(.2,1-.78*Math.sin(Math.PI*lt)));
    }
  });
  
  if (done || t > morph.total + 0.15){
    cur = morph.to; morph = null;
    applyScene(cur);
    setBusy(false);
  }
}


const emMap = new Map(emissives.map(e=>[e.mat,e]));
diorama.traverse(o=>{ if (o.isMesh && emMap.has(o.material)){ const e=emMap.get(o.material); if (!e.obj) e.obj=o; } });
practicals.forEach(p=>{ if (!p.obj) p.obj = p.light ? p.light.parent : p.sprite; });
function visOf(o){ let v=1; while (o && o!==diorama){ v *= clamp01(o.scale.x); o=o.parent; } return Math.min(1,v); }


const titleEl = document.getElementById('title');
const numEl = document.getElementById('num');
const morphBtn = document.getElementById('morph');
const modeBtn = document.getElementById('mode');
const knob = document.getElementById('knob');
const dotsEl = document.getElementById('dots');
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="#7a5b13" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.4" fill="#fff7dd" stroke="none"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none"><path d="M20 13.2A8.4 8.4 0 1 1 10.8 4a6.8 6.8 0 0 0 9.2 9.2Z" fill="#264653"/></svg>';
knob.innerHTML = SUN;
SCENES.forEach((s,i)=>{
  const b = document.createElement('button');
  b.className = 'dot'+(i===0?' on':''); b.title = s; b.setAttribute('aria-label',s);
  b.addEventListener('click', ()=> startMorph(i));
  dotsEl.appendChild(b);
});
function setTitle(name, idx){
  titleEl.classList.add('out');
  setTimeout(()=>{
    titleEl.textContent = name;
    numEl.textContent = String(idx+1).padStart(2,'0');
    titleEl.classList.remove('out'); titleEl.classList.add('pre');
    requestAnimationFrame(()=> requestAnimationFrame(()=> titleEl.classList.remove('pre')));
  }, 380);
  [...dotsEl.children].forEach((d,i)=> d.classList.toggle('on', i===idx));
}
function setBusy(b){ morphBtn.classList.toggle('busy', b); }
morphBtn.addEventListener('click', ()=> startMorph((cur+1)%4));
modeBtn.addEventListener('click', ()=>{
  modeTarget = modeTarget ? 0 : 1;
  document.body.classList.toggle('dark', !!modeTarget);
  knob.innerHTML = modeTarget ? MOON : SUN;
});
addEventListener('keydown', e=>{
  if (e.key==='m' || e.key==='M') startMorph((cur+1)%4);
  if (e.key==='l' || e.key==='L') modeBtn.click();
});
setTimeout(()=> document.getElementById('hint').style.opacity = 0, 7000);


const sunLight = C(0xfff1dc), moonLight = C(0xa8c4e8);
const hemiSkyL = C(0xdfeaf2), hemiSkyD = C(0x2a3f5c);
const hemiGndL = C(0xe8dcc4), hemiGndD = C(0x141f2b);


let T = 0, firstFrame = true, lastNow = performance.now(), introTimer = null;
function tick(){
  requestAnimationFrame(tick);
  const now = performance.now();
  const raw = Math.min(0.25, (now - lastNow)/1000); lastNow = now;
  const dt = Math.min(0.05, raw);
  T += dt; U.time.value = T;
  if (morph) stepMorph(raw);
  
  modeCur += (modeTarget - modeCur) * Math.min(1, raw*2.4);
  const m = modeCur; U.mode.value = m;
  
  const hot = morph ? morph.to : cur;
  for (let i=0;i<4;i++) weights[i] += ((i===hot?1:0) - weights[i]) * Math.min(1, raw*2.4);
  floorU.uGrassMix.value = blendNum(SP.grassMix, weights);
  blendCol(SP.woodA, weights, floorU.uWoodA.value);
  blendCol(SP.woodB, weights, floorU.uWoodB.value);
  rugU.uRound.value = blendNum(SP.rugRound, weights);
  blendCol(SP.rugField, weights, rugU.uField.value);
  blendCol(SP.rugBorder, weights, rugU.uBorder.value);
  blendCol(SP.rugMotif, weights, rugU.uMotif.value);
  blendCol(SP.wall, weights, M.cream.color);
  
  hemi.intensity = THREE.MathUtils.lerp(0.85, 0.22, m);
  hemi.color.lerpColors(hemiSkyL, hemiSkyD, m);
  hemi.groundColor.lerpColors(hemiGndL, hemiGndD, m);
  amb.intensity = THREE.MathUtils.lerp(0.22, 0.07, m);
  sun.intensity = THREE.MathUtils.lerp(2.7, 0.45, m);
  sun.color.lerpColors(sunLight, moonLight, m);
  renderer.toneMappingExposure = THREE.MathUtils.lerp(1.02, 0.92, m);
  
  emissives.forEach(e=>{
    const vis = e.obj ? visOf(e.obj) : 1;
    e.mat.emissiveIntensity = Math.max(0, e.base * (e.a + e.b*m) * vis);
  });
  practicals.forEach(p=>{
    const vis = p.obj ? visOf(p.obj) : 1;
    const flick = 1 + 0.055*m*Math.sin(T*11 + p.base*3.1)*Math.sin(T*5.3 + p.base);
    if (p.light) p.light.intensity = p.base * m * vis * flick;
    if (p.sprite) p.sprite.material.opacity = (p.light ? (0.12+0.88*m) : p.base*(0.25+0.75*m)) * vis;
  });
  
  flies.userData.mat.uniforms.uOn.value = m * weights[0];
  controls.update();
  renderer.render(scene, camera);
  if (firstFrame){
    firstFrame = false;
    introTimer = setTimeout(()=>{
      document.getElementById('loader').classList.add('done');
      if (qScene !== null && qScene !== 0){ applyScene(cur); setTitle(SCENES[cur], cur); }
      else startMorph(0, true);
    }, 500);
  }
}

addEventListener('resize', ()=>{
  const oldFit=fitDist, zoomRatio=oldFit>0 ? camera.position.distanceTo(controls.target)/oldFit : 1;
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  refit();
  const kept=THREE.MathUtils.clamp(fitDist*zoomRatio,controls.minDistance,controls.maxDistance);
  camera.position.sub(controls.target).setLength(kept).add(controls.target);
});
refit();
camera.position.sub(controls.target).setLength(fitDist).add(controls.target);

applyScene(0);
ACTORS.forEach(a=>{ a.group.scale.setScalar(0); a.forms.forEach(f=> f && f.scale.setScalar(0)); });

const qScene = (()=>{ const v = parseInt(new URLSearchParams(location.search).get('scene')||'',10);
  return Number.isFinite(v) ? Math.min(3, Math.max(0, v)) : null; })();
if (qScene !== null && qScene !== 0){
  cur = qScene;
  for (let k=0;k<4;k++) weights[k] = k===cur?1:0;
}
tick();
