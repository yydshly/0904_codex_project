<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arnis World Forge</title>
  <desc id="desc">地理数据被编译成方块城市的深色技术插画。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07100e"/>
      <stop offset="1" stop-color="#17312c"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#497b42"/>
      <stop offset="1" stop-color="#1d3a2b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#020706" flood-opacity=".62"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#dbe8dc" stroke-opacity=".06"/>
    </pattern>
  </defs>
