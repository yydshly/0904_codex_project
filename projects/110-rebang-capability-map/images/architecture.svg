<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">热点信息聚合系统模块化架构</title>
  <desc id="desc">信息来源依次经过采集接入、数据处理、数据存储、聚合服务和产品展示。来源管理、异常监控、失败重试与合规治理为横向保障。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #64748b; }
      .step { font: 700 15px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #2563eb; letter-spacing: 1px; }
      .module { font: 700 22px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0f172a; }
      .detail { font: 400 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #475569; }
      .guard-title { font: 700 19px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0f172a; }
      .guard-item { font: 500 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1440" height="560" rx="28" fill="url(#background)"/>
  <text x="720" y="52" text-anchor="middle" class="title">热点信息聚合系统</text>
  <text x="720" y="82" text-anchor="middle" class="subtitle">从公开信息来源到统一产品展示的六模块主链路</text>

  <g filter="url(#shadow)">
    <g transform="translate(40 130)">
      <rect width="190" height="190" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
      <rect width="190" height="7" rx="4" fill="#2563eb"/>
      <text x="20" y="40" class="step">01</text>
      <text x="20" y="76" class="module">信息来源</text>
      <text x="20" y="116" class="detail"><tspan x="20">公开热榜</tspan><tspan x="20" dy="26">公开 API</tspan><tspan x="20" dy="26">RSS / Atom</tspan></text>
    </g>

    <g transform="translate(274 130)">
      <rect width="190" height="190" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
      <rect width="190" height="7" rx="4" fill="#2563eb"/>
      <text x="20" y="40" class="step">02</text>
      <text x="20" y="76" class="module">采集接入</text>
      <text x="20" y="116" class="detail"><tspan x="20">定时任务</tspan><tspan x="20" dy="26">平台适配器</tspan><tspan x="20" dy="26">请求与解析</tspan></text>
    </g>

    <g transform="translate(508 130)">
      <rect width="190" height="190" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
      <rect width="190" height="7" rx="4" fill="#2563eb"/>
      <text x="20" y="40" class="step">03</text>
      <text x="20" y="76" class="module">数据处理</text>
      <text x="20" y="116" class="detail"><tspan x="20">清洗校验</tspan><tspan x="20" dy="26">字段标准化</tspan><tspan x="20" dy="26">基础去重</tspan></text>
    </g>

    <g transform="translate(742 130)">
      <rect width="190" height="190" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
      <rect width="190" height="7" rx="4" fill="#2563eb"/>
      <text x="20" y="40" class="step">04</text>
      <text x="20" y="76" class="module">数据存储</text>
      <text x="20" y="116" class="detail"><tspan x="20">最新榜单缓存</tspan><tspan x="20" dy="26">历史快照</tspan><tspan x="20" dy="26">可追溯记录</tspan></text>
    </g>

    <g transform="translate(976 130)">
      <rect width="190" height="190" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
      <rect width="190" height="7" rx="4" fill="#2563eb"/>
      <text x="20" y="40" class="step">05</text>
      <text x="20" y="76" class="module">聚合服务</text>
      <text x="20" y="116" class="detail"><tspan x="20">频道分类</tspan><tspan x="20" dy="26">排序与查询</tspan><tspan x="20" dy="26">统一输出</tspan></text>
    </g>

    <g transform="translate(1210 130)">
      <rect width="190" height="190" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
      <rect width="190" height="7" rx="4" fill="#2563eb"/>
      <text x="20" y="40" class="step">06</text>
      <text x="20" y="76" class="module">产品展示</text>
      <text x="20" y="116" class="detail"><tspan x="20">极简热榜</tspan><tspan x="20" dy="26">每日摘要</tspan><tspan x="20" dy="26">原文跳转</tspan></text>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 236 225 H 266"/>
    <path d="M 470 225 H 500"/>
    <path d="M 704 225 H 734"/>
    <path d="M 938 225 H 968"/>
    <path d="M 1172 225 H 1202"/>
  </g>

  <g transform="translate(180 390)">
    <rect width="1080" height="112" rx="22" fill="#e0eaff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="42" y="42" class="guard-title">横向保障</text>

    <g transform="translate(220 0)">
      <circle cx="0" cy="38" r="7" fill="#2563eb"/>
      <text x="18" y="44" class="guard-item">来源管理</text>
    </g>
    <g transform="translate(430 0)">
      <circle cx="0" cy="38" r="7" fill="#2563eb"/>
      <text x="18" y="44" class="guard-item">异常监控</text>
    </g>
    <g transform="translate(640 0)">
      <circle cx="0" cy="38" r="7" fill="#2563eb"/>
      <text x="18" y="44" class="guard-item">失败重试</text>
    </g>
    <g transform="translate(850 0)">
      <circle cx="0" cy="38" r="7" fill="#2563eb"/>
      <text x="18" y="44" class="guard-item">合规治理</text>
    </g>

    <text x="540" y="84" text-anchor="middle" class="subtitle">保障来源持续可用、数据结果可信、访问行为可控</text>
  </g>

  <g stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 7" fill="none">
    <path d="M 370 390 V 340"/>
    <path d="M 720 390 V 340"/>
    <path d="M 1070 390 V 340"/>
  </g>
</svg>

