    <radialGradient id="glow" cx="78%" cy="22%" r="52%"><stop offset="0" stop-color="#b9f36a" stop-opacity=".18"/><stop offset="1" stop-color="#b9f36a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#glow)"/>
  <g stroke="#b2dfca" stroke-opacity=".09"><path d="M0 140h1600M0 260h1600M0 380h1600M0 500h1600M0 620h1600M0 740h1600"/><path d="M180 0v900M420 0v900M660 0v900M900 0v900M1140 0v900M1380 0v900"/></g>
