      <g fill="#edf7ef" font-size="31" font-weight="700"><text x="26" y="102">来源</text><text x="296" y="102">采集</text><text x="566" y="102">标准化</text><text x="836" y="102">沉淀</text><text x="1106" y="102">输出</text></g>
      <g fill="#587068" font-size="15" letter-spacing="2"><text x="26" y="137">SOURCE</text><text x="296" y="137">COLLECT</text><text x="566" y="137">NORMALIZE</text><text x="836" y="137">STORE</text><text x="1106" y="137">DELIVER</text></g>
