    <text x="100" y="250" fill="#edf7ef" font-size="92" font-weight="700">TopHub 能力图谱</text>
    <text x="104" y="308" fill="#8da49c" font-size="28">把分散的热门榜单，转成可检索、可回溯、可行动的信号流</text>
