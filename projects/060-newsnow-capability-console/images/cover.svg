<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">NewsNow 能力控制台架构图</title>
  <desc id="desc">从多平台来源经过 getter、缓存和标准化，输出到网页、API 与 MCP 的信号链路。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100f"/><stop offset="1" stop-color="#0d1d19"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8fe6c4" stroke-opacity=".045"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1010" cy="110" r="190" fill="#ff6b4a" opacity=".055"/>
  <text x="70" y="84" fill="#ff6b4a" font-family="Consolas,monospace" font-size="15" letter-spacing="3">RESEARCH 060 / OPEN-SOURCE SIGNAL INTAKE</text>
  <text x="70" y="142" fill="#eff9f4" font-family="Segoe UI,sans-serif" font-size="46" font-weight="650">NewsNow 能力控制台</text>
  <text x="70" y="179" fill="#96aaa2" font-family="Segoe UI,sans-serif" font-size="19">把分散热榜转成统一、可缓存、可被人和 AI 消费的信号流</text>

  <g transform="translate(70 245)">
    <rect width="220" height="205" rx="14" fill="#0c1816" stroke="#cfeae0" stroke-opacity=".18"/>
    <text x="22" y="33" fill="#5e746c" font-family="Consolas,monospace" font-size="11">01 / SOURCES</text>
    <text x="22" y="72" fill="#eff9f4" font-family="Segoe UI,sans-serif" font-size="22" font-weight="600">多平台来源</text>
    <g font-family="Segoe UI,sans-serif" font-size="13" fill="#96aaa2">
      <rect x="22" y="97" width="76" height="34" rx="7" fill="#ff6b4a" fill-opacity=".12"/><text x="36" y="119">社交热榜</text>
      <rect x="106" y="97" width="91" height="34" rx="7" fill="#8fe6c4" fill-opacity=".08"/><text x="120" y="119">科技社区</text>
      <rect x="22" y="139" width="76" height="34" rx="7" fill="#8fe6c4" fill-opacity=".08"/><text x="36" y="161">财经快讯</text>
      <rect x="106" y="139" width="91" height="34" rx="7" fill="#8fe6c4" fill-opacity=".08"/><text x="120" y="161">新闻媒体</text>
    </g>
    <text x="22" y="190" fill="#ff6b4a" font-family="Consolas,monospace" font-size="11">47 WEB-VISIBLE</text>
  </g>

  <g transform="translate(337 245)">
    <rect width="220" height="205" rx="14" fill="#0c1816" stroke="#cfeae0" stroke-opacity=".18"/>
    <text x="22" y="33" fill="#5e746c" font-family="Consolas,monospace" font-size="11">02 / ADAPTERS</text>
    <text x="22" y="72" fill="#eff9f4" font-family="Segoe UI,sans-serif" font-size="22" font-weight="600">来源 getter</text>
    <path d="M22 105H198M22 140H198M22 175H198" stroke="#cfeae0" stroke-opacity=".13"/>
    <g font-family="Consolas,monospace" font-size="12"><text x="22" y="97" fill="#8fe6c4">JSON API</text><text x="22" y="132" fill="#8fe6c4">HTML / CHEERIO</text><text x="22" y="167" fill="#8fe6c4">RSS / RSSHUB</text></g>
    <circle cx="183" cy="94" r="4" fill="#8fe6c4"/><circle cx="183" cy="129" r="4" fill="#8fe6c4"/><circle cx="183" cy="164" r="4" fill="#8fe6c4"/>
  </g>

  <g transform="translate(604 245)">
    <rect width="220" height="205" rx="14" fill="#0c1816" stroke="#ff6b4a" stroke-opacity=".3"/>
    <text x="22" y="33" fill="#5e746c" font-family="Consolas,monospace" font-size="11">03 / CONTROL</text>
    <text x="22" y="72" fill="#eff9f4" font-family="Segoe UI,sans-serif" font-size="22" font-weight="600">缓存 + 标准化</text>
    <circle cx="69" cy="132" r="36" fill="#ff6b4a" fill-opacity=".11" stroke="#ff6b4a" stroke-opacity=".5"/>
    <text x="50" y="128" fill="#ff6b4a" font-family="Consolas,monospace" font-size="11">30m</text><text x="50" y="143" fill="#96aaa2" font-family="Consolas,monospace" font-size="9">TTL</text>
    <path d="M114 104H194M114 132H194M114 160H194" stroke="#cfeae0" stroke-opacity=".15"/>
    <g fill="#96aaa2" font-family="Consolas,monospace" font-size="10"><text x="114" y="98">id · title</text><text x="114" y="126">url · date</text><text x="114" y="154">extra</text></g>
    <text x="22" y="190" fill="#8fe6c4" font-family="Consolas,monospace" font-size="11">PULL-THROUGH</text>
  </g>

  <g transform="translate(871 245)">
    <rect width="259" height="205" rx="14" fill="#0c1816" stroke="#cfeae0" stroke-opacity=".18"/>
    <text x="22" y="33" fill="#5e746c" font-family="Consolas,monospace" font-size="11">04 / DELIVERY</text>
    <text x="22" y="72" fill="#eff9f4" font-family="Segoe UI,sans-serif" font-size="22" font-weight="600">人读 + 机器调用</text>
    <g font-family="Segoe UI,sans-serif" font-size="14">
      <rect x="22" y="101" width="63" height="48" rx="9" fill="#8fe6c4" fill-opacity=".1" stroke="#8fe6c4" stroke-opacity=".22"/><text x="38" y="130" fill="#8fe6c4">WEB</text>
      <rect x="96" y="101" width="63" height="48" rx="9" fill="#8fe6c4" fill-opacity=".1" stroke="#8fe6c4" stroke-opacity=".22"/><text x="113" y="130" fill="#8fe6c4">API</text>
      <rect x="170" y="101" width="67" height="48" rx="9" fill="#ff6b4a" fill-opacity=".1" stroke="#ff6b4a" stroke-opacity=".3"/><text x="187" y="130" fill="#ff6b4a">MCP</text>
    </g>
    <text x="22" y="190" fill="#5e746c" font-family="Consolas,monospace" font-size="11">HUMAN + MACHINE</text>
  </g>

  <g stroke="#ff6b4a" stroke-opacity=".55" fill="none"><path d="M290 347H337"/><path d="M557 347H604"/><path d="M824 347H871"/></g>
  <g fill="#ff6b4a"><path d="M333 342l8 5-8 5z"/><path d="M600 342l8 5-8 5z"/><path d="M867 342l8 5-8 5z"/></g>

  <line x1="70" y1="511" x2="1130" y2="511" stroke="#cfeae0" stroke-opacity=".14"/>
  <text x="70" y="558" fill="#5e746c" font-family="Consolas,monospace" font-size="12" letter-spacing="2">POSITION</text>
  <text x="70" y="604" fill="#eff9f4" font-family="Segoe UI,sans-serif" font-size="30" font-weight="600">Signal Intake Layer</text>
  <text x="373" y="603" fill="#5e746c" font-family="Segoe UI,sans-serif" font-size="24">≠</text>
  <text x="421" y="604" fill="#96aaa2" font-family="Segoe UI,sans-serif" font-size="30">News Intelligence Platform</text>
  <text x="1130" y="605" text-anchor="end" fill="#ff6b4a" font-family="Consolas,monospace" font-size="12">v0.0.41 / 2026.09</text>
</svg>
